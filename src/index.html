<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horloge avec Heures de Prière</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <!-- Lien vers le fichier CSS -->

</head>

<body>
    <div class="toggle-container">
        <span id="toggleOff" class="material-icons toggle_icon toggle_off">toggle_off</span>
        <span id="toggleOn" class="material-icons toggle_icon toggle_on hidden">toggle_on</span>
    </div>
    <div class="clock-container">
        <p class="title"> Muslim Clock</p>
        <div id="time-container">
            <div id="clock" class="clock"></div>
            <div id="time-until-prayer"></div>
            <div id="date-container">
                <p id="hijri-date-fr"></p>
                <p id="hijri-date"></p>
            </div>
        </div>

        <div id="salat-container" class="hidden">
            <div id="city"></div>
            <div id="prayer-times"></div>
            <div id="compass">
                <div id="compass-circle">
                  <span class="east">E</span>
                  <span class="west">W</span>
                  <div id="direction-arrow"></div>
                </div>
                <p id="qiblah-angle">Angle : 0°</p>
              </div>
        </div>
        <div id="weather-container" class="hidden">
            <h2>Météo</h2>
            <div id="weather-forecast"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button id="btn-clock" class="nav-btn active">Horloge</button>
        <button id="btn-prayers" class="nav-btn">Salat</button>
        <button id="btn-weather" class="nav-btn">Météo</button>
    </div>
    <script defer type="module" src="index.js"></script>
</body>

</html>
